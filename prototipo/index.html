<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PHS · Sistema de Pesquisa Recorrente 1Doc
   Tokens UMDS (claro) para a pesquisa pública
   Tema escuro alto contraste para o painel interno
   ============================================================ */
:root{
  /* --- UMDS / 1Doc --- */
  --primary:#0058db;
  --primary-ink:#00409e;
  --primary-wash:#e8f0fd;
  --bg:#f4f6f9;
  --surface:#ffffff;
  --surface-2:#fafbfc;
  --border:#dde3ea;
  --border-strong:#c3ccd8;
  --ink:#16202e;
  --ink-soft:#5a6a7d;
  --ink-faint:#8b98a8;
  --pos:#0a7f57;
  --pos-wash:#e6f5ef;
  --neg:#c1301a;
  --neg-wash:#fdeceb;
  --warn:#a86a05;
  --warn-wash:#fdf3e2;
  --r-btn:6px;
  --r-card:10px;
  --shadow-card:0 1px 2px rgba(22,32,46,.05), 0 8px 24px -12px rgba(22,32,46,.12);
  --shadow-pop:0 12px 40px -12px rgba(22,32,46,.28);

  /* --- painel escuro --- */
  --d-bg:#0c1119;
  --d-surface:#141b26;
  --d-surface-2:#1b2430;
  --d-border:#26313f;
  --d-border-2:#334252;
  --d-ink:#eef3f9;
  --d-ink-soft:#93a3b6;
  --d-ink-faint:#647689;
  --d-primary:#4d8dff;
  --d-primary-wash:#132340;
  --d-pos:#2fd18a;
  --d-neg:#ff6f56;
  --d-warn:#f2b544;

  --sans:'Open Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:transparent;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:3px}
.dark :focus-visible{outline-color:var(--d-primary)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.app{min-height:100vh}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.hide{display:none!important}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}

/* ========== SHELL PESQUISA ========== */
.pub{background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
.pub-top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.pub-top-in{max-width:1120px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.01em;flex-shrink:0}
.brand-mark{width:26px;height:26px;border-radius:var(--r-btn);background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:-.03em}
.brand-sub{color:var(--ink-faint);font-weight:400;font-size:13px;border-left:1px solid var(--border);padding-left:10px;margin-left:2px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.proto-chip{font-family:var(--mono);font-size:12px;color:var(--ink-soft);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-btn);padding:4px 9px;white-space:nowrap}
.pub-progress{height:3px;background:var(--border);position:relative;overflow:hidden}
.pub-progress i{position:absolute;inset:0 auto 0 0;background:var(--primary);width:0;transition:width .5s cubic-bezier(.2,.7,.2,1)}

.pub-body{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:34px 24px 90px;display:grid;grid-template-columns:232px 1fr;gap:44px;align-items:start}
.pub-body>*{min-width:0}
.trail-compact{display:none}

/* --- trilha de tramitação (assinatura) --- */
.trail{position:sticky;top:96px}
.trail-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:6px}
.tr-item{display:grid;grid-template-columns:22px 1fr;gap:11px;padding:9px 0;position:relative}
.tr-item::before{content:'';position:absolute;left:10.5px;top:26px;bottom:-9px;width:1px;background:var(--border)}
.tr-item:last-child::before{display:none}
.tr-item.done::before{background:var(--primary)}
.tr-dot{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink-faint);z-index:1;transition:all .3s}
.tr-item.done .tr-dot{background:var(--primary);border-color:var(--primary);color:#fff}
.tr-item.now .tr-dot{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px var(--primary-wash)}
.tr-name{font-size:13.5px;font-weight:600;color:var(--ink-faint);line-height:1.35;transition:color .2s}
.tr-item.done .tr-name,.tr-item.now .tr-name{color:var(--ink)}
.tr-stamp{font-family:var(--mono);font-size:10.5px;color:var(--pos);letter-spacing:.02em;margin-top:2px}
.tr-item.now .tr-stamp{color:var(--primary)}

/* --- cartão de pergunta --- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-card);padding:38px 40px}
.enter>.card,.enter>.receipt{animation:cardIn .38s cubic-bezier(.2,.7,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.card-eyebrow b{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--primary);background:var(--primary-wash);padding:3px 7px;border-radius:4px}
.q{font-size:25px;font-weight:700;letter-spacing:-.022em;line-height:1.26;margin-bottom:10px;max-width:30ch}
.q-help{font-size:14.5px;color:var(--ink-soft);margin-bottom:26px;max-width:58ch}
.q-core{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);border:1px dashed var(--border-strong);padding:2px 6px;border-radius:4px}
.fields{display:flex;flex-direction:column;gap:24px}
.f-label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px}
.f-label span{font-weight:400;color:var(--ink-faint)}
.inp,select.inp{width:100%;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-btn);padding:11px 13px;font-size:14.5px;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-wash);outline:none}
textarea.inp{min-height:112px;resize:vertical;line-height:1.6}
.charc{font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-align:right;margin-top:6px}

/* opções */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--border-strong);border-radius:var(--r-btn);cursor:pointer;background:var(--surface);text-align:left;transition:all .15s;font-size:14.5px;width:100%}
.opt:hover{border-color:var(--primary);background:var(--surface-2)}
.opt.on{border-color:var(--primary);background:var(--primary-wash);box-shadow:inset 0 0 0 1px var(--primary)}
.opt-box{width:18px;height:18px;border:1.5px solid var(--border-strong);border-radius:4px;display:grid;place-items:center;flex-shrink:0;color:transparent;font-size:11px;font-weight:700}
.opt-box.round{border-radius:50%}
.opt.on .opt-box{background:var(--primary);border-color:var(--primary);color:#fff}
.opt b{font-weight:600}
.opt small{display:block;color:var(--ink-soft);font-size:12.5px;font-weight:400;margin-top:1px}
.opts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}

/* NPS */
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
.nps button{aspect-ratio:1;border:1px solid var(--border-strong);border-radius:var(--r-btn);background:var(--surface);font-family:var(--mono);font-size:15px;font-weight:500;cursor:pointer;transition:all .13s}
.nps button:hover{border-color:var(--primary);transform:translateY(-2px)}
.nps button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;transform:translateY(-2px);box-shadow:0 4px 12px -4px rgba(0,88,219,.5)}
.scale-ends{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--ink-faint)}

/* escala 1-7 */
.lik{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.lik button{padding:13px 0;border:1px solid var(--border-strong);border-radius:var(--r-btn);background:var(--surface);font-family:var(--mono);font-size:14px;cursor:pointer;transition:all .13s}
.lik button:hover{border-color:var(--primary)}
.lik button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.lik-row{padding:19px 0;border-bottom:1px solid var(--border)}
.lik-row:last-child{border-bottom:none;padding-bottom:2px}
.lik-row-h{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.lik-row-h b{font-size:14.5px;font-weight:600}
.lik-row-h span{font-size:12.5px;color:var(--ink-faint)}

/* botões */
.actions{display:flex;align-items:center;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid var(--border)}
.btn{border:1px solid transparent;border-radius:var(--r-btn);padding:11px 20px;font-size:14.5px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px}
.btn-pri{background:var(--primary);color:#fff}
.btn-pri:hover{background:var(--primary-ink)}
.btn-pri:disabled{background:var(--border);color:var(--ink-faint);cursor:not-allowed}
.btn-gho{background:transparent;color:var(--ink-soft);border-color:var(--border-strong)}
.btn-gho:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn-txt{background:none;color:var(--ink-soft);border:none;padding:11px 4px}
.btn-txt:hover{color:var(--primary)}
.act-note{margin-left:auto;font-size:12.5px;color:var(--ink-faint)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-soft);background:var(--surface-2)}

/* abertura */
.open-hero{display:flex;flex-direction:column;gap:22px}
.open-title{font-size:38px;font-weight:700;letter-spacing:-.032em;line-height:1.1;max-width:22ch}
.open-title em{font-style:normal;color:var(--primary)}
.open-lead{font-size:16px;color:var(--ink-soft);max-width:56ch;line-height:1.62}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;margin:6px 0}
.fact{background:var(--surface);padding:16px 18px}
.fact b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.02em}
.fact span{font-size:12.5px;color:var(--ink-faint)}
.callout{background:var(--primary-wash);border:1px solid #c4dafb;border-left:3px solid var(--primary);border-radius:var(--r-btn);padding:15px 17px;font-size:14px;line-height:1.6}
.callout b{font-weight:700}

/* comprovante */
.receipt{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-card);overflow:hidden}
.rec-top{background:var(--primary);color:#fff;padding:26px 34px}
.rec-top .eyebrow{color:#a8c8f7}
.rec-top h2{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:7px 0 5px}
.rec-top p{font-size:14px;color:#cfe0fb;max-width:52ch}
.rec-body{padding:28px 34px 32px}
.rec-line{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px dashed var(--border);font-size:14px}
.rec-line:last-of-type{border-bottom:none}
.rec-line span{color:var(--ink-soft)}
.rec-line b{font-family:var(--mono);font-weight:600;text-align:right}
.badge-lv{display:inline-flex;align-items:center;gap:9px;background:var(--warn-wash);border:1px solid #f0d9a8;border-radius:999px;padding:6px 14px 6px 8px;font-size:13.5px;font-weight:600;color:#7a4d02;margin:20px 0 6px}
.badge-lv i{width:24px;height:24px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;font-style:normal}
.steps-next{margin-top:22px;border-top:1px solid var(--border);padding-top:22px}
.sn{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:8px 0;font-size:14px;color:var(--ink-soft)}
.sn i{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--primary);background:var(--primary-wash);border-radius:4px;display:grid;place-items:center;font-style:normal;height:20px;margin-top:1px}

.warn-bar{background:var(--warn-wash);border-bottom:1px solid #f0d9a8;color:#6b4302;font-size:12.5px;padding:8px 24px;text-align:center}
.dark .warn-bar{background:#2a2005;border-color:#4a3a0d;color:var(--d-warn)}

/* ========== PAINEL ESCURO ========== */
.dark{background:var(--d-bg);color:var(--d-ink);min-height:100vh}
.dk-top{background:var(--d-surface);border-bottom:1px solid var(--d-border);position:sticky;top:0;z-index:20}
.dk-top-in{max-width:1360px;margin:0 auto;padding:0 26px;height:58px;display:flex;align-items:center;gap:16px}
.dark .brand-mark{background:var(--d-primary);color:#06101f}
.dark .brand-sub{color:var(--d-ink-faint);border-color:var(--d-border)}
.dk-body{max-width:1360px;margin:0 auto;padding:26px 26px 80px}
.dk-sel{background:var(--d-surface-2);border:1px solid var(--d-border-2);border-radius:var(--r-btn);color:var(--d-ink);padding:7px 11px;font-size:13px;font-family:var(--mono)}
.dk-btn{background:var(--d-surface-2);border:1px solid var(--d-border-2);color:var(--d-ink-soft);border-radius:var(--r-btn);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.dk-btn:hover{border-color:var(--d-primary);color:var(--d-ink)}
.dk-btn.pri{background:var(--d-primary);color:#06101f;border-color:var(--d-primary)}
.dk-btn.pri:hover{filter:brightness(1.12)}
.dk-btn:disabled{opacity:.45;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--d-surface);border:1px solid var(--d-border);border-radius:var(--r-card);padding:19px 21px;position:relative;overflow:hidden}
.kpi.hero{background:linear-gradient(155deg,#16233a,var(--d-surface) 62%);border-color:#2b3d59}
.kpi-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--d-ink-faint);display:flex;align-items:center;gap:7px}
.kpi-v{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1.12;margin:9px 0 3px}
.kpi.hero .kpi-v{color:var(--d-primary);font-size:46px}
.kpi-d{font-family:var(--mono);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.up{color:var(--d-pos)}.down{color:var(--d-neg)}.flat{color:var(--d-ink-faint)}
.kpi-n{font-size:12px;color:var(--d-ink-faint);margin-top:7px;line-height:1.45}
.spark{position:absolute;right:0;bottom:0;opacity:.5}

.grid2{display:grid;grid-template-columns:1.42fr 1fr;gap:14px;margin-bottom:14px;align-items:start}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;align-items:start}
.panel{background:var(--d-surface);border:1px solid var(--d-border);border-radius:var(--r-card);padding:21px 23px}
.panel-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.panel-h h3{font-size:15.5px;font-weight:700;letter-spacing:-.015em}
.panel-h p{font-size:12.5px;color:var(--d-ink-faint);margin-top:3px;line-height:1.45}
.panel-h .right{margin-left:auto;flex-shrink:0}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;border:1px solid var(--d-border-2);color:var(--d-ink-faint)}

.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:1fr;gap:6px}
.bar-top{display:flex;align-items:baseline;gap:9px;font-size:13.5px}
.bar-top b{font-weight:600}
.bar-top .n{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--d-ink-soft)}
.bar-track{height:7px;background:var(--d-surface-2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--d-primary);width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar-sub{font-size:12px;color:var(--d-ink-faint)}
.chg{font-family:var(--mono);font-size:11.5px;font-weight:500}

.movers{display:flex;flex-direction:column;gap:10px}
.mv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--d-surface-2);border:1px solid var(--d-border);border-radius:var(--r-btn);padding:12px 14px}
.mv-ar{font-family:var(--mono);font-size:15px;font-weight:600;width:20px;text-align:center}
.mv b{font-size:13.5px;font-weight:600;display:block}
.mv span{font-size:12px;color:var(--d-ink-faint)}
.mv-v{font-family:var(--mono);font-size:14px;font-weight:600;text-align:right}

.cmts{display:flex;flex-direction:column;gap:11px;max-height:430px;overflow-y:auto;padding-right:6px}
.cmts::-webkit-scrollbar{width:8px}.cmts::-webkit-scrollbar-thumb{background:var(--d-border-2);border-radius:4px}
.cmt{background:var(--d-surface-2);border:1px solid var(--d-border);border-left:2.5px solid var(--d-border-2);border-radius:var(--r-btn);padding:13px 15px}
.cmt.det{border-left-color:var(--d-neg)}.cmt.pro{border-left-color:var(--d-pos)}.cmt.neu{border-left-color:var(--d-warn)}
.cmt-h{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.cmt-h .sc{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--d-bg);border:1px solid var(--d-border-2)}
.cmt-h .who{font-size:12px;color:var(--d-ink-faint)}
.cmt p{font-size:13.5px;line-height:1.58;color:#d7e1ec}
.cmt-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.cmt-tags i{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;background:var(--d-primary-wash);color:#9dc0ff;padding:2px 6px;border-radius:3px}

.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--d-surface-2);border:1px solid var(--d-border-2);color:var(--d-ink-soft);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;transition:all .15s}
.chip:hover{color:var(--d-ink)}
.chip.on{background:var(--d-primary-wash);border-color:var(--d-primary);color:#a9c9ff;font-weight:600}

.q-table{width:100%;border-collapse:collapse;font-size:13px;color:var(--d-ink);font-family:var(--sans)}
.q-table th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--d-ink-faint);font-weight:500;padding:0 12px 10px 0;border-bottom:1px solid var(--d-border)}
.q-table td{padding:12px 12px 12px 0;border-bottom:1px solid var(--d-border);vertical-align:top}
.q-table tr:last-child td{border-bottom:none}
.q-table .nm{font-weight:600}
.q-table .sub{font-size:11.5px;color:var(--d-ink-faint);margin-top:2px}
.pill{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.det{background:#3a1410;color:var(--d-neg)}
.pill.neu{background:#332504;color:var(--d-warn)}
.pill.pro{background:#0c2b1e;color:var(--d-pos)}

.ai-out{background:var(--d-bg);border:1px solid var(--d-border);border-radius:var(--r-btn);padding:16px 18px;margin-top:14px}
.ai-theme{padding:12px 0;border-bottom:1px solid var(--d-border)}
.ai-theme:last-child{border-bottom:none;padding-bottom:0}
.ai-theme .th{display:flex;align-items:baseline;gap:10px}

  if (n.includes('prefeitura') || n.startsWith('município')) return 'Prefeitura';

/* ============================================================
   3 · CÁLCULO
   IRD = índice do redesign. A taxa de reversão fica FORA dele:
   composto dilui, e esse número precisa ser visto puro.
   ============================================================ */
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
const r1 = n => Math.round(n * 10) / 10;
const plur = (n, s1, sN) => n + ' ' + (n === 1 ? s1 : sN);

const umuxLite = (u1, u2) => 0.65 * (((u1 - 1) + (u2 - 1)) / 12 * 100) + 22.9;
const cesNorm = v => v.length ? (avg(v) - 1) / 6 * 100 : 0;
const prefIdx = objs => {                       // matriz vs legado: -1..+1 -> 0..100
  const all = objs.flatMap(o => Object.values(o || {}).filter(v => v !== null && v !== undefined));
  return all.length ? (avg(all) + 1) / 2 * 100 : 0;
};
function scoresFor(list) {
  if (!list.length) return null;
  const ativos = list.filter(r => r.status !== 'voltou');
  const rev = list.filter(r => r.status === 'voltou');
  const umux = ativos.length ? avg(ativos.map(r => umuxLite(r.u1, r.u2))) : 0;
  const ces = cesNorm(ativos.flatMap(r => Object.values(r.ces || {}).filter(Boolean)));
  const nota = avg(list.map(r => r.nota).filter(n => n !== null && n !== undefined));
  const pref = prefIdx(ativos.map(r => r.legado));
  return {
    n: list.length, nAtivos: ativos.length, nRev: rev.length,
    ird: r1(0.35 * umux + 0.25 * ces + 0.20 * nota * 10 + 0.20 * pref),
    umux: r1(umux), ces: r1(ces), cesRaw: r1(avg(ativos.flatMap(r => Object.values(r.ces || {}).filter(Boolean)))),
    nota: r1(nota), pref: r1(pref),
    reversao: r1(rev.length / list.length * 100),
    risco: r1(ativos.filter(r => r.risco > 0).length / (ativos.length || 1) * 100),
    naoSabe: ativos.filter(r => r.status === 'nao_sei').length,
    admin: r1(avg(ativos.map(r => r.admin).filter(v => v !== null && v !== undefined))),
    atrito: r1(ativos.filter(r => r.admin >= 2).length / (ativos.length || 1) * 100)
  };
}
const notaBand = s => s >= 9 ? 'pro' : s >= 7 ? 'neu' : 'det';
const notaLabel = s => s >= 9 ? 'Promotor' : s >= 7 ? 'Neutro' : 'Detrator';
function nivel(k) {
  if (k >= 4) return { n: 'Diamante', i: 'IV', d: 'Roadmap preview trimestral e selo do órgão' };
  if (k === 3) return { n: 'Ouro', i: 'III', d: 'Sessão fechada de roadmap com a equipe de produto' };
  if (k === 2) return { n: 'Prata', i: 'II', d: 'Acesso antecipado às próximas telas do redesign' };
  return { n: 'Bronze', i: 'I', d: 'Acompanhamento das suas sugestões' };
}

const FLOW_BASE = ['abertura', 'cliente', 'perfil', 'status'];

const FLOW_REV = ['rev_quando', 'rev_motivos', 'rev_volta', 'nota', 'encerrar', 'recibo'];
function flow() {
  if (S.a.status === 'voltou') return [...FLOW_BASE, ...FLOW_REV];
  if (S.a.status) return [...FLOW_BASE, ...FLOW_USA];
  return FLOW_BASE;
}
const BLOCOS_DEF = [
  { n: 'Abertura', keys: ['abertura'] },
  { n: 'Quem responde', keys: ['cliente', 'perfil', 'status', 'uso'] },
  { n: 'O redesign', keys: ['nota', 'umux', 'legado', 'rev_quando', 'rev_motivos', 'rev_volta'] },
  { n: 'No dia a dia', keys: ['ces', 'areas', 'risco', 'prioridade'] },
  { n: 'Encerramento', keys: ['encerrar', 'recibo'] }
];
/* só os blocos que existem no caminho atual — quem voltou ao legado não passa por todos */
const blocosDoFluxo = () => { const f = flow();
  return BLOCOS_DEF.map(b => ({ ...b, mine: b.keys.filter(k => f.includes(k)) })).filter(b => b.mine.length); };
const curKey = () => flow()[S.step] || 'recibo';
const isLast = () => curKey() === 'recibo';

function trailHTML() {
  const k = curKey(), bs = blocosDoFluxo();
  const cur = bs.findIndex(b => b.mine.includes(k));
  return `<div class="trail">
    <div class="trail-compact"><b>${String(cur + 1).padStart(2, '0')}/${String(bs.length).padStart(2, '0')}</b><i>${bs[cur].n}</i></div>
    <div class="trail-h">Etapas</div><div class="trail-list">` +
    bs.map((b, i) => {
      const done = i < cur, now = i === cur;
      const feitos = b.mine.filter(x => S.stamps[x]).length;
      return `<div class="tr-item ${done ? 'done' : ''} ${now ? 'now' : ''}">
        <div class="tr-dot">${done ? '✓' : String(i + 1).padStart(2, '0')}</div>
        <div><div class="tr-name">${b.n}</div>
        ${done ? `<div class="tr-stamp">concluído ${S.stamps[b.mine[b.mine.length - 1]] || ''}</div>`
        : now ? `<div class="tr-stamp">em andamento · ${feitos}/${b.mine.length}</div>` : ''}</div></div>`;
    }).join('') + `</div></div>`;
}

function opt(act, label, sub, on, round) {
  return `<button class="opt ${on ? 'on' : ''}" data-act="${act}">
    <span class="opt-box ${round ? 'round' : ''}">${round ? '●' : '✓'}</span>
    <span><b>${label}</b>${sub ? `<small>${sub}</small>` : ''}</span></button>`;

function likert(name, val, lo, hi) {
  let b = ''; for (let i = 1; i <= 7; i++) b += `<button class="${val === i ? 'on' : ''}" data-act="${name}:${i}">${i}</button>`;

function lineChart(waves, series, min = 40) {
  const W = 760, H = 250, L = 40, R = 20, T = 22, B = 34;
  const iw = W - L - R, ih = H - T - B, n = waves.length;
  const x = i => L + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const y = v => T + ih - ((Math.max(min, v) - min) / (100 - min)) * ih;
  let g = '';
  [0, 1, 2, 3, 4].map(i => Math.round(min + (100 - min) * i / 4)).forEach(v => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--d-border)"/>
      <text x="${L - 8}" y="${y(v) + 4}" fill="var(--d-ink-faint)" font-size="10" text-anchor="end">${v}</text>`;
  });
  waves.forEach((w, i) => {
    const an = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
    g += `<text x="${x(i)}" y="${H - 12}" fill="var(--d-ink-faint)" font-size="10.5" text-anchor="${an}">${w}</text>`;
  });
  let p = '';
  series.forEach(s => {
    const pts = s.vals.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    if (s.area) p += `<polygon points="${x(0)},${y(min)} ${pts} ${x(n - 1)},${y(min)}" fill="${s.c}" opacity=".1"/>`;
    p += `<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="${s.w || 1.6}"
      stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="4 4"' : ''}/>`;
    if (s.dots) s.vals.forEach((v, i) => {
      const da = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
      p += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--d-surface)" stroke="${s.c}" stroke-width="2"/>
        <text x="${x(i)}" y="${y(v) - 13}" fill="${s.c}" font-size="11.5" font-weight="600" text-anchor="${da}">${v}</text>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Série histórica do índice do redesign">${g}${p}</svg>`;
}
function spark(vals, c) {
  const W = 96, H = 34, mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => `${i * W / (Math.max(1, vals.length - 1))},${H - 4 - ((v - mn) / rg) * (H - 10)}`).join(' ');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6" opacity=".9"/></svg>`;
}
function delta(cur, prev, unit, inverso) {
  if (prev == null) return `<span class="flat">— primeira onda</span>`;
  const d = r1(cur - prev);
  const bom = inverso ? d < -0.4 : d > 0.4, ruim = inverso ? d > 0.4 : d < -0.4;
  const cls = bom ? 'up' : ruim ? 'down' : 'flat';
  const ar = d > 0.4 ? '▲' : d < -0.4 ? '▼' : '■';
  return `<span class="${cls}">${ar} ${d > 0 ? '+' : ''}${d}${unit || ''} vs onda anterior</span>`;
}
function hbars(rows, opts = {}) {
  const max = Math.max(...rows.map(r => r.v), opts.max || 0.0001);
  return `<div class="bars">${rows.map(r => `<div class="bar-row">
    <div class="bar-top"><b>${r.n}</b>${r.chg != null ? `<span class="chg ${r.chgCls}">${r.chg}</span>` : ''}
      <span class="n">${r.label}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, r.v / max * 100)}%;background:${r.c || 'var(--d-primary)'}"></div></div>
    ${r.sub ? `<div class="bar-sub">${r.sub}</div>` : ''}</div>`).join('')}</div>`;
}
function stack100(rows) {
  return `<div class="bars">${rows.map(r => {
    const t = r.up + r.eq + r.dn || 1;
    return `<div class="bar-row"><div class="bar-top"><b>${r.n}</b>
      <span class="n" style="color:${r.up - r.dn > 0 ? 'var(--d-pos)' : r.up - r.dn < 0 ? 'var(--d-neg)' : 'var(--d-ink-faint)'}">${r.up - r.dn > 0 ? '+' : ''}${r1((r.up - r.dn) / t * 100)}</span></div>
      <div class="bar-track" style="display:flex;height:12px">
        <div style="width:${r.up / t * 100}%;background:var(--d-pos);opacity:.85"></div>
        <div style="width:${r.eq / t * 100}%;background:var(--d-ink-faint);opacity:.45"></div>
        <div style="width:${r.dn / t * 100}%;background:var(--d-neg);opacity:.85"></div>
      </div>
      <div class="bar-sub">${r.up} melhor · ${r.eq} igual · ${r.dn} pior</div></div>`;
  }).join('')}</div>`;
}

function taxoCount(list) {
  const m = {};
  list.forEach(r => {
    const txt = [r.notaWhy, r.oneThing, r.timeSink, r.legadoWorse, r.riscoWhy, r.adminWhy, r.revPonto, r.revTraria].join(' ');
    new Set(classify(txt)).forEach(c => { if (c !== 'Não classificado') m[c] = (m[c] || 0) + 1; });
  });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
}
function cesByJorn(list) {
  return JORN.map(j => { const v = list.map(r => r.ces?.[j.k]).filter(Boolean);
    return { ...j, v: v.length ? r1(avg(v)) : null, cnt: v.length }; });
}
function satByArea(list) {
  return AREAS_RD.map(m => { const v = list.map(r => r.sat?.[m]).filter(Boolean);
    return { m, v: v.length ? r1(avg(v)) : null, cnt: v.length }; });
}
function dimCounts(list) {
  return DIMS.map(d => ({ n: d.n,
    up: list.filter(r => r.legado?.[d.k] === 1).length,
    eq: list.filter(r => r.legado?.[d.k] === 0).length,
    dn: list.filter(r => r.legado?.[d.k] === -1).length }));
}

        label: x.s ? x.s.reversao + '% · ' + x.s.nRev + ' de ' + x.s.n : '—',
        c: 'var(--d-neg)' })), { max: 30 })}
      <div class="panel-h" style="margin:22px 0 12px"><div><h3 style="font-size:14px">Tempo de uso antes de voltar</h3>
        <p>Desistir em um dia é adaptação. Desistir em semanas é lacuna real.</p></div></div>
      ${revs.length ? hbars(tempoRows, { max: revs.length }) : '<div class="empty"><p>Nenhuma reversão nesta onda.</p></div>'}
    </div>
  </div>

  <div class="grid2b">
    <div class="panel"><div class="panel-h"><div><h3>Redesign versus versão anterior, item por item</h3>
      <p>Onde o redesign ganhou e onde perdeu. Só quem está com ele ativo responde. O número à direita é o saldo em pontos percentuais.</p></div>
      <div class="right"><span class="tag">n=${ativos.length}</span></div></div>
      ${stack100(dimCounts(ativos))}
      <div class="legend"><span><i style="background:var(--d-pos)"></i>Melhor no redesign</span>
        <span><i style="background:var(--d-ink-faint)"></i>Igual</span>
        <span><i style="background:var(--d-neg)"></i>Melhor na anterior</span></div>
    </div>
    <div class="panel"><div class="panel-h"><div><h3>Motivos de quem voltou</h3>
      <p>Marcação múltipla de ${plur(revs.length, 'pessoa', 'pessoas')} desta onda. Abaixo, o que cada uma disse que a traria de volta.</p></div></div>
      ${revs.length ? hbars(motRows, { max: revs.length }) + `<div class="cmts" style="max-height:250px;margin-top:18px">
        ${revs.map(r => `<div class="cmt det">
          <div class="cmt-h"><span class="sc">nota ${r.nota}</span><span class="pill det">voltou</span>
            <span class="who">${esc(r.papel)} · ${esc(r.cliente.nome)}</span></div>
          <p>${esc(r.revPonto)}</p>
          <p style="margin-top:9px;color:var(--d-ink-soft)"><b style="color:var(--d-pos)">Traria de volta:</b> ${esc(r.revTraria)}</p>
          <div class="cmt-tags"><i>usou ${esc(r.revUsou).toLowerCase()}</i>${classify(r.revPonto + ' ' + r.revTraria).map(c => `<i>${c}</i>`).join('')}</div>
        </div>`).join('')}</div>`
        : '<div class="empty"><b>Nenhuma reversão nesta onda</b><p>Se isso se mantiver por duas ondas, a migração pode ser considerada estável.</p></div>'}
    </div>
  </div>

  <div class="grid2b">
    <div class="panel"><div class="panel-h"><div><h3>Áreas do redesign</h3>
      <p>Satisfação por área, ${S.waveSel} contra a onda anterior.</p></div></div>
      ${hbars(sat.filter(x => x.v != null).sort((a, b) => a.v - b.v).map(x => ({
        n: x.m, v: x.v, label: x.v + '/7',
        chg: satP[x.m] != null ? (r1(x.v - satP[x.m]) > 0 ? '+' : '') + r1(x.v - satP[x.m]) : null,
        chgCls: satP[x.m] != null ? (x.v - satP[x.m] > 0.05 ? 'up' : x.v - satP[x.m] < -0.05 ? 'down' : 'flat') : '',
        c: x.v < 4 ? 'var(--d-neg)' : x.v < 5.2 ? 'var(--d-warn)' : 'var(--d-pos)'
      })), { max: 7 })}
      ${up.length || down.length ? `<div class="panel-h" style="margin:22px 0 12px"><div><h3 style="font-size:14px">O que melhorou e o que piorou</h3></div></div>
      <div class="movers">${[...up, ...down].map(m => `<div class="mv">
        <span class="mv-ar ${m.d > 0 ? 'up' : 'down'}">${m.d > 0 ? '▲' : '▼'}</span>
        <div><b>${m.m}</b><span>${m.v}/7 · ${plur(m.cnt, 'resposta', 'respostas')}</span></div>
        <span class="mv-v ${m.d > 0 ? 'up' : 'down'}">${m.d > 0 ? '+' : ''}${m.d}</span></div>`).join('')}</div>` : ''}
    </div>
    <div class="panel"><div class="panel-h"><div><h3>Esforço por jornada</h3>
      <p>Onde a tarefa custa caro, mesmo com a tela nova.</p></div></div>
      ${hbars(ces.filter(j => j.v != null && j.cnt > 0).map(j => ({
        n: j.n, v: j.v, label: j.v + '/7',
        chg: cesP[j.k] != null ? (r1(j.v - cesP[j.k]) > 0 ? '+' : '') + r1(j.v - cesP[j.k]) : null,
        chgCls: cesP[j.k] != null ? (j.v - cesP[j.k] > 0.05 ? 'up' : j.v - cesP[j.k] < -0.05 ? 'down' : 'flat') : '',
        c: j.v < 4 ? 'var(--d-neg)' : j.v < 5.2 ? 'var(--d-warn)' : 'var(--d-pos)', sub: plur(j.cnt, 'resposta', 'respostas')
      })), { max: 7 })}
      <div class="panel-h" style="margin:24px 0 12px"><div><h3 style="font-size:14px">Atrito entre os dois layouts</h3>
        <p>Criação de processos e Administrativo seguem no layout antigo. Média ${sc.admin} de 3.</p></div></div>
      ${hbars(ADMIN_ATRITO.map(x => { const v = ativos.filter(r => r.admin === x.v).length;
        return { n: x.n, v, label: String(v), c: x.v >= 2 ? 'var(--d-neg)' : x.v === 1 ? 'var(--d-warn)' : 'var(--d-pos)' }; }))}
      <p style="font-size:12px;color:var(--d-ink-faint);margin-top:14px;line-height:1.5">${r1(ativos.filter(r => r.admin >= 2).length / (ativos.length || 1) * 100)}% sentem atrito ao alternar entre os dois layouts. Enquanto a criação de processos e o Administrativo não migrarem, esse número é um piso para o IRD.</p>
    </div>
  </div>

  <div class="grid2">
    <div class="panel"><div class="panel-h"><div><h3>Comentários da onda</h3>
      <p>Motivo da nota, prioridade número um, o que era melhor na versão antiga.</p></div>
      <div class="right"><button class="dk-btn ${S.aiLoading ? '' : 'pri'}" data-act="ai" ${S.aiLoading ? 'disabled' : ''}>
        ${S.aiLoading ? '<span class="spin"></span> agrupando' : 'Agrupar temas com IA'}</button></div></div>
      <div class="filters">${[['all', 'Todos'], ['rev', 'Voltaram'], ['risco', 'Risco de voltar'], ['det', 'Nota ≤6'], ['pro', 'Nota ≥9']]
        .map(([k, n]) => `<button class="chip ${S.filt === k ? 'on' : ''}" data-act="filt:${k}">${n}</button>`).join('')}</div>
      ${S.ai ? aiHTML() : ''}
      <div class="cmts">${cmts.map(r => {
        const isRev = r.status === 'voltou';
        const band = isRev ? 'det' : notaBand(r.nota);
        return `<div class="cmt ${band}">
        <div class="cmt-h"><span class="sc">nota ${r.nota}</span>
          <span class="pill ${band}">${isRev ? 'voltou ao legado' : notaLabel(r.nota)}</span>
          ${!isRev && r.risco > 0 ? `<span class="pill neu">pensou em voltar</span>` : ''}
          ${r.status === 'nao_sei' ? `<span class="pill neu">não sabe a versão</span>` : ''}
          <span class="who">${esc(r.papel)} · ${esc(r.cliente.nome)}</span></div>
        <p>${esc(isRev ? r.revPonto : r.notaWhy)}</p>
        ${r.oneThing ? `<p style="margin-top:9px;color:var(--d-ink-soft)"><b style="color:var(--d-ink)">Mudaria:</b> ${esc(r.oneThing)}</p>` : ''}
        ${r.legadoWorse ? `<p style="margin-top:5px;color:var(--d-ink-soft)"><b style="color:var(--d-warn)">Era melhor antes:</b> ${esc(r.legadoWorse)}</p>` : ''}
        ${r.riscoWhy ? `<p style="margin-top:5px;color:var(--d-ink-soft)"><b style="color:var(--d-warn)">Pensou em voltar porque:</b> ${esc(r.riscoWhy)}</p>` : ''}
        ${isRev ? `<p style="margin-top:5px;color:var(--d-ink-soft)"><b style="color:var(--d-pos)">Traria de volta:</b> ${esc(r.revTraria)}</p>` : ''}
        <div class="cmt-tags">${classify([r.notaWhy, r.oneThing, r.legadoWorse, r.riscoWhy, r.revPonto].join(' ')).map(c => `<i>${c}</i>`).join('')}</div>
      </div>`; }).join('')}</div>
    </div>

    <div class="panel"><div class="panel-h"><div><h3>Fila de entrevistas</h3>
      <p>Até 10 por onda, ordenadas pelo dado: quem voltou ao legado primeiro, depois nota baixa, depois quem pensou em voltar.</p></div>
      <div class="right"><span class="tag">${Math.min(fila.length, 10)}/10</span></div></div>
      ${fila.length ? `<table class="q-table"><thead><tr><th>Pessoa</th><th>Nota</th><th>Por que ela</th></tr></thead><tbody>
        ${fila.slice(0, 10).map(r => `<tr>
          <td><div class="nm">${esc(r.nome || 'Anônimo')}</div><div class="sub">${esc(r.papel)}</div>
            <div class="sub">${esc(r.cliente.nome)}</div></td>
          <td><span class="pill ${r.status === 'voltou' ? 'det' : notaBand(r.nota)}">${r.nota}</span></td>
          <td><div class="sub" style="margin:0">${r.status === 'voltou' ? 'Voltou ao legado após ' + esc(r.revUsou).toLowerCase()
            : r.nota <= 6 ? 'Nota baixa' : r.risco > 0 ? 'Pensou em voltar' : 'Contraponto positivo'}</div></td>
        </tr>`).join('')}</tbody></table>
        <p style="font-size:12px;color:var(--d-ink-faint);margin-top:14px;line-height:1.5">Composição: ${plur(fila.filter(r => r.status === 'voltou').length, 'reversão', 'reversões')}, ${plur(fila.filter(r => r.status !== 'voltou' && r.nota <= 6).length, 'nota baixa', 'notas baixas')}, ${plur(fila.filter(r => r.status !== 'voltou' && r.nota >= 9).length, 'promotor', 'promotores')}. O promotor entra para dizer o que não mexer.</p>`
        : '<div class="empty"><p>Ninguém aceitou conversar nesta onda ainda.</p></div>'}

      <div class="panel-h" style="margin:24px 0 12px"><div><h3 style="font-size:14px">Temas mais citados</h3>
        <p>Taxonomia fixa, comparável entre ondas.</p></div></div>
      ${hbars(taxCur.slice(0, 7).map(([n, v]) => {
        const p = taxPrev[n] ?? null, d = p == null ? null : v - p;
        return { n, v, label: v + ' de ' + cur.length,
          chg: d == null ? null : (d > 0 ? '+' : '') + d, chgCls: d > 0 ? 'down' : d < 0 ? 'up' : 'flat',
          c: v / cur.length > .35 ? 'var(--d-neg)' : v / cur.length > .2 ? 'var(--d-warn)' : 'var(--d-primary)' };
      }))}
      ${sc.naoSabe ? `<p style="font-size:12px;color:var(--d-warn);margin-top:16px;line-height:1.5">${plur(sc.naoSabe, 'pessoa', 'pessoas')} não soube dizer em qual versão está. Um redesign que não é percebido é um dado sobre a comunicação da virada, não sobre a interface.</p>` : ''}
    </div>
  </div>`);
}

function aiHTML() {
  if (S.ai.error) return `<div class="ai-out"><p style="font-size:13px;color:var(--d-neg)">${esc(S.ai.error)}</p></div>`;
  return `<div class="ai-out"><div class="kpi-l" style="margin-bottom:6px">Temas agrupados por IA · ${S.ai.temas.length} grupos</div>
    ${S.ai.temas.map(t => `<div class="ai-theme"><div class="th"><b>${esc(t.tema)}</b>
      <span class="tag" style="color:${t.severidade === 'alta' ? 'var(--d-neg)' : t.severidade === 'média' ? 'var(--d-warn)' : 'var(--d-ink-faint)'}">${esc(t.severidade || '')}</span>
      <span class="cnt">${t.frequencia} menções</span></div>
      <p>${esc(t.resumo)}</p>${t.citacao ? `<q>${esc(t.citacao)}</q>` : ''}</div>`).join('')}</div>`;
}

async function runAI() {
  S.aiLoading = true; S.ai = null; render();
  const cur = byWave(S.waveSel);
  const blob = cur.map((r, i) => `[${i + 1}] nota ${r.nota} · ${r.papel} · ${r.status === 'voltou' ? 'VOLTOU AO LEGADO' : 'usa o redesign'}
${r.status === 'voltou' ? `motivo da volta: ${r.revPonto}\no que traria de volta: ${r.revTraria}`
      : `motivo da nota: ${r.notaWhy}\nmudaria: ${r.oneThing}\nera melhor antes: ${r.legadoWorse || '—'}\nperde tempo: ${r.timeSink || '—'}`}`).join('\n\n');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000,
        messages: [{ role: 'user', content: `Você analisa uma pesquisa sobre o REDESIGN de um sistema de gestão de processos e documentos usado por prefeituras e câmaras no Brasil. Os usuários migraram há pouco tempo e podem desativar o redesign e voltar ao layout anterior. Algumas telas (criação de processos e Administrativo) ainda não foram redesenhadas, então há atrito de conviver com dois layouts. Abaixo, ${cur.length} respostas da onda ${S.waveSel}.

Agrupe em no máximo 6 temas por PROBLEMA REAL do redesign, não por palavra usada. Dê peso maior a quem voltou ao legado. Ordene por impacto na adoção. Responda APENAS com JSON válido, sem markdown e sem preâmbulo:
{"temas":[{"tema":"nome curto em português","frequencia":número,"severidade":"alta"|"média"|"baixa","resumo":"uma ou duas frases sobre o que acontece e para quem","citacao":"trecho literal curto"}]}

RESPOSTAS:
${blob}` }] })
    });
    const data = await res.json();
    const txt = data.content.filter(c => c.type === 'text').map(c => c.text).join('\n');
    const cl = txt.replace(/```json|```/g, '').trim();
    const p = JSON.parse(cl.slice(cl.indexOf('{'), cl.lastIndexOf('}') + 1));
    S.ai = { temas: (p.temas || []).slice(0, 6) };
  } catch { S.ai = { error: 'Não foi possível agrupar os temas agora. A taxonomia fixa continua valendo.' }; }
  S.aiLoading = false; render();
}

/* ============================================================
   10 · EVENTOS
   ============================================================ */
function render() {
  if (S.loading) { el('app').innerHTML = `<div class="dark" style="display:grid;place-items:center;min-height:100vh"><span class="spin"></span></div>`; return; }
  if (S.route === 'painel') { S.anim = false; return S.auth ? renderPainel() : renderLogin(); }
  renderPesquisa(); S.anim = false;
}
const saveDraft = () => DB.set(DRAFT, { step: S.step, proto: S.proto, opened: S.opened, stamps: S.stamps, a: S.a }, false);
async function next() {
  if (S.step === 0 && !S.proto) { S.proto = codigo(); S.opened = hhmm(new Date()); }
  if (!S.stamps[curKey()]) S.stamps[curKey()] = hhmm(new Date());
  const f = flow();
  if (f[S.step + 1] === 'recibo') await submitSurvey();
  S.step = Math.min(f.length - 1, S.step + 1); S.anim = true;
  saveDraft(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function okNow() {
  const a = S.a, k = curKey();
  if (k === 'nota') return a.nota !== null && (a.status === 'voltou' || a.notaWhy.trim().length >= 15);
  if (k === 'rev_motivos') return a.revMotivos.length > 0 && a.revPonto.trim().length >= 15;
  if (k === 'rev_volta') return a.revTraria.trim().length >= 15 && !!a.revRecomenda;
  if (k === 'prioridade') return a.oneThing.trim().length >= 5;
  if (k === 'risco') return a.risco !== null && (a.risco === 0 || a.riscoWhy.trim().length >= 15) && a.nps !== null;
  if (k === 'perfil') return !!(a.papel && (a.papel !== 'Outro' || a.papelOutro.trim()) && a.tempo && a.freq);
  if (k === 'encerrar') return a.talk !== null && (!a.talk || (a.nome.trim() && a.email.includes('@')));
  return true;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const [act, ...rest] = b.dataset.act.split(':'); const arg = rest.join(':');
  const a = S.a;
  if (act === 'next') return next();
  if (act === 'back') { S.step = Math.max(0, S.step - 1); S.anim = true; saveDraft(); return render(); }
  if (act === 'pick') { a.cliente = CLIENTES.find(c => c.id === arg) || null; S.query = ''; }
  else if (act === 'unpick') { a.cliente = null; S.query = ''; }
  else if (act === 'set') a[rest[0]] = rest.slice(1).join(':');
  else if (act === 'tog') { const f = rest[0], v = rest.slice(1).join(':');
    a[f] = a[f].includes(v) ? a[f].filter(x => x !== v) : [...a[f], v];
    if (f === 'areas') Object.keys(a.sat).forEach(x => { if (!a.areas.includes(x)) delete a.sat[x]; });
    if (f === 'jorn') Object.keys(a.ces).forEach(x => { if (!a.jorn.includes(x)) delete a.ces[x]; }); }
  else if (act === 'status') { if (a.status !== arg) { a.status = arg; } }
  else if (act === 'nota') a.nota = +arg;
  else if (act === 'nps') a.nps = +arg;
  else if (act === 'u1') a.u1 = +arg;
  else if (act === 'u2') a.u2 = +arg;
  else if (act === 'dim') { const [k, v] = arg.split(':'); a.legado[k] = +v; }
  else if (act === 'ces') { const [k, v] = arg.split(':'); a.ces[k] = +v; }
  else if (act === 'sat') { const i = arg.lastIndexOf(':'); a.sat[arg.slice(0, i)] = +arg.slice(i + 1); }
  else if (act === 'admin') a.admin = +arg;
  else if (act === 'risco') a.risco = +arg;
  else if (act === 'talk') a.talk = arg === '1';
  else if (act === 'restart') { S.step = 0; S.proto = null; S.stamps = {}; S.sent = false; S.query = '';
    S.streak = Math.min(4, S.streak + 1); S.a = emptyA(); S.anim = true;
    await DB.del(DRAFT, false); return render(); }
  else if (act === 'login') { if ((el('pw')?.value || '') === 'produto2026') { S.auth = true; S.ai = null; await loadData(); return render(); }
    el('lerr').innerHTML = '<div class="err">senha incorreta</div>'; return; }
  else if (act === 'logout') { S.auth = false; location.hash = '#/pesquisa'; return render(); }
  else if (act === 'filt') { S.filt = arg; return render(); }
  else if (act === 'tipo') { S.tipoFilt = arg; S.ai = null; return render(); }
  else if (act === 'ai') return runAI();
  else if (act === 'clear') { const ks = await DB.keys(RK, true);
    await Promise.all(ks.map(k => DB.del(k, true))); await DB.set(CFG, { seeded: true }, true);
    S.data = []; S.ai = null; toast('Demonstração apagada. O painel agora só mostra respostas reais.'); return render(); }
  else return;
  saveDraft(); render();
});
document.addEventListener('input', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, f] = b.dataset.act.split(':');
  if (act === 'query') { S.query = b.value; render(); const i = el('cq');
    if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
  if (act !== 'txt') return;
  S.a[f] = b.value;
  const cc = b.parentElement.querySelector('.charc');
  if (cc) cc.textContent = b.value.length + ' caracteres' + (cc.textContent.includes('mínimo') ? cc.textContent.slice(cc.textContent.indexOf(' · mínimo')) : '');
  const btn = b.closest('.card')?.querySelector('.actions [data-act="next"].btn-pri');
  if (btn) btn.disabled = !okNow();
  saveDraft();
});
document.addEventListener('change', e => {
  const b = e.target.closest('select[data-act]'); if (!b) return;
  if (b.dataset.act === 'wave') { S.waveSel = b.value; S.ai = null; render(); }
});
document.addEventListener('keydown', e => {
  if (S.route === 'painel') { if (e.key === 'Enter' && !S.auth) document.querySelector('[data-act="login"]')?.click(); return; }
  if (isLast()) return;
  if (e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA') {
    const btn = document.querySelector('.actions [data-act="next"].btn-pri');
    if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
  }
  const k = curKey();
  if ((k === 'nota' || k === 'risco') && /^[0-9]$/.test(e.key) && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
    if (k === 'nota') S.a.nota = +e.key; else S.a.nps = +e.key;
    render();
  }
});

/* ============================================================
   11 · BOOT
   ============================================================ */
async function loadData() { S.data = (await DB.all(RK, true)).sort((a, b) => new Date(b.at) - new Date(a.at)); }
(async function boot() {
  S.route = readRoute();
  const cfg = await DB.get(CFG, true), ex = await DB.keys(RK, true);
  if (!cfg?.seeded && ex.length === 0) {
    await Promise.all(buildSeed().map(r => DB.set(RK + r.id, r, true)));
    await DB.set(CFG, { seeded: true }, true);
  }
  const d = await DB.get(DRAFT, false);
  if (d && d.a) { S.step = d.step || 0; S.proto = d.proto; S.opened = d.opened; S.stamps = d.stamps || {}; S.a = { ...emptyA(), ...d.a }; }
  await loadData(); S.loading = false; render();
})();
</script>

</html>
